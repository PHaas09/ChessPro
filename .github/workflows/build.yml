name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compile and run the JUnit tests
        run: |
          curl -sSLo junit.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.3/junit-platform-console-standalone-1.11.3.jar
          javac -d out -cp junit.jar src/ChessPro.java test/ChessProTest.java
          java -Djava.awt.headless=true -jar junit.jar execute -cp out --select-class ChessProTest --fail-if-no-tests
